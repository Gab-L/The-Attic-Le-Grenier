services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: grenier
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: grenier
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - grenier-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grenier"]
      interval: 2s
      timeout: 5s
      retries: 15
volumes:
  grenier-db:
